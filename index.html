<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c95d73" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Coach JM" />
  <title>Coach JM</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">COACH JM</p>
      <h1>Base V1 prête</h1>
      <p class="subtitle">Programme prévu · séance réalisée · progression mesurable.</p>
    </header>

    <section class="card">
      <h2>État technique</h2>
      <dl class="status-list">
        <div><dt>Application</dt><dd id="app-status">Initialisation…</dd></div>
        <div><dt>Base locale</dt><dd id="db-status">Initialisation…</dd></div>
        <div><dt>Schéma</dt><dd id="schema-status">—</dd></div>
      </dl>
    </section>

    <section class="card">
      <h2>Collections V1</h2>
      <div id="stores" class="chips"></div>
    </section>

    <section class="card note">
      <strong>Étape suivante</strong>
      <p>Construire le catalogue d’exercices et le premier flux vertical : Programme → Séance → Historique.</p>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
