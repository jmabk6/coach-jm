<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#fff8f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Coach JM">
  <title>Coach JM</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./coachjm-v48.css">

<script>
(async function () {
  try {
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ("caches" in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (e) {
    console.warn("Coach JM cache cleanup", e);
  }
})();
</script>

<script>
window.addEventListener('error', function(e){
  var d=document.createElement('div');
  d.style='position:fixed;inset:16px;z-index:99999;background:#fff;color:#900;padding:16px;border:2px solid #c66;overflow:auto;font:13px/1.4 monospace;white-space:pre-wrap';
  d.textContent='Coach JM erreur JS\n'+(e.message||'Erreur inconnue')+'\n'+(e.filename||'')+':'+(e.lineno||'');
  document.body.appendChild(d);
});
window.addEventListener('unhandledrejection', function(e){
  var d=document.createElement('div');
  d.style='position:fixed;inset:16px;z-index:99999;background:#fff;color:#900;padding:16px;border:2px solid #c66;overflow:auto;font:13px/1.4 monospace;white-space:pre-wrap';
  d.textContent='Coach JM promesse rejetée\n'+String(e.reason && (e.reason.stack||e.reason.message||e.reason));
  document.body.appendChild(d);
});
</script>
</head>
<body>
  <main id="app"></main>
  <nav class="bottom-nav" aria-label="Navigation principale">
    <button data-route="today" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8v9.7a.5.5 0 0 1-.5.5H15v-6H9v6H3.5a.5.5 0 0 1-.5-.5z"/></svg></span>
      <span>Aujourd’hui</span>
    </button>
    <button data-route="program" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M6 2v3M18 2v3M3.5 8h17M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2z"/></svg></span>
      <span>Programme</span>
    </button>
    <button data-route="sessions" class="nav-item nav-main">
      <span class="plus">+</span><span>Séance</span>
    </button>
    <button data-route="progress" class="nav-item">
      <span class="nav-icon chart"><svg viewBox="0 0 24 24"><path d="M5 20V12M12 20V4M19 20V9"/></svg></span>
      <span>Progression</span>
    </button>
    <button data-route="more" class="nav-item">
      <span class="nav-icon dots">•••</span><span>Plus</span>
    </button>
  </nav>
  <script type="module" src="./coachjm-v48.js"></script>
<div class="version-badge">v48</div>
</body>
</html>
