<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff4f3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Coach JM" />
  <title>Coach JM</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div><div class="brand">Coach JM</div><div class="date" id="today-label">Aujourd’hui</div></div>
      <button class="avatar" aria-label="Profil">JM</button>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Navigation principale">
      <button class="nav-item active" data-route="today"><span>⌂</span><small>Aujourd’hui</small></button>
      <button class="nav-item" data-route="program"><span>▣</span><small>Programme</small></button>
      <button class="nav-item nav-create" data-route="new"><span>＋</span><small>Séance</small></button>
      <button class="nav-item" data-route="progress"><span>↗</span><small>Progression</small></button>
      <button class="nav-item" data-route="more"><span>•••</span><small>Plus</small></button>
    </nav>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
